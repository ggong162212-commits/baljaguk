<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F5EC">
<title>발자국 · 운영진</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>🐾</text></svg>">
<link rel="stylesheet" href="assets/style.css?v=202610201634">
</head>
<body>

<header class="topbar wide" id="topbar" hidden>
  <div class="in">
    <div class="brandmark grow">
      <span class="dot" id="brandIcon"></span>
      <span class="wordmark">운영진</span>
      <span class="badge" id="modeBadge"></span>
    </div>
    <button class="iconbtn" id="gearBtn" type="button" aria-label="설정"></button>
    <button class="iconbtn" data-theme-btn type="button"></button>
  </div>
</header>

<!-- 입구 — 카카오 로그인한 운영진만 들어온다 -->
<main class="app" id="login">
  <div style="height:8vh"></div>
  <div class="card center" style="padding:30px 22px" id="gateCard">
    <div class="mut sm">확인 중…</div>
  </div>

  <!-- 비상 로그인 — 카카오가 막혔을 때만. 아무것도 저장하지 않는다 -->
  <div class="linkline" style="margin-top:18px">
    <button type="button" class="linkbtn" id="sosOpen">비상 로그인</button>
  </div>
  <form id="loginForm" class="card" style="margin-top:10px;text-align:left" hidden>
    <h3 style="font-size:15px">비상 로그인</h3>
    <div class="sub">카카오 로그인이 안 될 때만 쓰는 공유 계정이에요. 이 기기에 저장하지 않아요.</div>
    <div class="sp"></div>
    <label class="field" style="margin-bottom:10px">
      <span class="lb">이메일</span>
      <input class="input" id="em" type="email" autocomplete="off" placeholder="운영진 공유 계정" required>
    </label>
    <label class="field" style="margin-bottom:10px">
      <span class="lb">비밀번호</span>
      <input class="input" id="pw" type="password" autocomplete="off" placeholder="••••••" required>
    </label>
    <button class="btn primary lg block" type="submit" id="loginBtn">들어가기</button>
    <p class="sm mut" style="margin-top:12px" id="loginHint"></p>
  </form>

  <div class="linkline"><a href="me.html">← 발자국 커뮤니티로</a></div>
</main>

<!-- 관리 화면 -->
<main class="app wide" id="admin" hidden>

  <!-- 폼 관리 -->
  <section class="view" id="v-form">
    <div class="pagehead">
      <h1>폼 관리</h1>
      <p id="formLead">신청 접수를 켜고 끄거나 마감 시각을 예약할 수 있어요.</p>
    </div>
    <div class="seg" id="formPick" style="margin-bottom:10px"></div>
    <div class="sm mut" id="formMoved" style="margin:0 4px 14px"></div>

    <!-- ① 2학기 활동의견 및 개파 -->
    <div id="surveyPanel" hidden>
      <div id="surveyLink"></div>
      <div class="sp"></div>
      <div id="surveyStats"></div>
      <div class="sp"></div>
      <div id="surveyGap"></div>
      <div class="sp"></div>
      <div id="surveyStations"></div>
      <div class="sp"></div>
      <div class="chips" id="surveyChips"></div>
      <div class="search" style="margin-bottom:12px">
        <span id="surveySearchIcon"></span>
        <input id="surveySearch" placeholder="이름·지하철역·의견으로 찾기" aria-label="응답 검색">
      </div>
      <div class="sm mut" id="surveyNote" style="margin:-4px 4px 10px" hidden></div>
      <div id="surveyList" class="stack"></div>
      <div class="sp"></div>
      <button class="btn ghost block" id="exportSurvey" type="button">응답 엑셀로 저장</button>
    </div>

    <!-- ② 1365 회원명부 -->
    <div id="id1365Panel" class="stack" hidden></div>
  </section>

  <!-- 가입 신청 -->
  <section class="view" id="v-apply">
    <div class="pagehead">
      <h1>가입 신청</h1>
      <p>입금증을 확인하고 승인하면 구성원으로 등록돼요.</p>
    </div>
    <div id="formPanel" class="stack"></div>
    <div class="sp"></div>
    <div class="chips" id="applyChips"></div>
    <div class="search" style="margin-bottom:12px">
      <span id="applySearchIcon"></span>
      <input id="applySearch" placeholder="이름·학번으로 찾기" aria-label="신청자 검색">
    </div>
    <div id="applyBulk"></div>
    <div id="applyList" class="stack"></div>
  </section>

  <!-- 구성원 -->
  <section class="view" id="v-members">
    <div class="pagehead">
      <h1>구성원</h1>
      <p>함께하는 발자국 멤버</p>
    </div>
    <div id="memberStats"></div>
    <div class="sp"></div>
    <div class="search" style="margin-bottom:10px">
      <span id="memberSearchIcon"></span>
      <input id="memberSearch" placeholder="이름, 학번으로 검색하세요" aria-label="구성원 검색">
    </div>
    <div class="chips" id="memberChips"></div>
    <div id="memberInvite" style="margin-top:10px"></div>
    <div class="row between" style="margin:2px 0 10px">
      <div class="seg" id="memberSort" style="flex:1"></div>
    </div>
    <div id="memberList" class="stack"></div>
    <div class="sp"></div>
    <div class="row" style="gap:8px">
      <button class="btn soft grow" id="addMember" type="button">구성원 추가</button>
      <button class="btn ghost" id="exportMembers" type="button">내보내기</button>
    </div>
  </section>

  <!-- 봉사 참여 -->
  <section class="view" id="v-vol">
    <div class="pagehead">
      <h1>봉사 참여</h1>
      <p>날짜를 고르고 그 날의 봉사모임을 만들어보세요.</p>
    </div>
    <div id="calendar"></div>
    <div class="sp"></div>
    <div id="volRank"></div>
  </section>

  <!-- 재정 -->
  <section class="view" id="v-fin">
    <div class="pagehead">
      <h1>동아리 재정</h1>
      <p>운영진만 볼 수 있는 동아리비 장부예요.</p>
    </div>
    <div id="finTop"></div>
    <div class="sp"></div>
    <div class="row" style="gap:8px;margin-bottom:10px">
      <div class="seg grow" id="finSeg"></div>
      <select class="input" id="finMonth" style="width:auto;padding:10px 34px 10px 12px" aria-label="월 선택"></select>
    </div>
    <div id="finList" class="stack"></div>
    <div class="sp"></div>
    <div class="row" style="gap:8px">
      <button class="btn soft grow" id="addFin" type="button">내역 추가</button>
      <button class="btn ghost" id="exportFin" type="button">엑셀 저장</button>
    </div>
  </section>

  <!-- 후원 -->
  <section class="view" id="v-donate">
    <div class="pagehead">
      <h1>후원</h1>
      <p>보호소 후원을 모으고 쓰임을 공개하는 공간이에요.</p>
    </div>
    <div id="donatePanel" class="stack"></div>
  </section>

  <!-- 설정 -->
  <section class="view" id="v-settings">
    <div class="pagehead">
      <h1>설정</h1>
      <p>동아리 정보와 계정을 관리해요.</p>
    </div>
    <div id="settingsPanel" class="stack"></div>
  </section>

  <div class="tabgap"></div>
</main>

<nav class="tabbar" id="tabbar" hidden aria-label="관리 메뉴"></nav>

<script src="assets/config.js?v=202610201634"></script>
<script src="assets/icons.js?v=202610201634"></script>
<script src="assets/ui.js?v=202610201634"></script>
<script src="assets/db.js?v=202610201634"></script>
<script src="assets/push.js?v=202610201634"></script>
<script src="assets/admin.js?v=202610201634"></script>
</body>
</html>
