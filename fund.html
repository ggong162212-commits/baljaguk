<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F5EC">
<title>발자국 · 후원금 현황</title>
<meta name="description" content="발자국이 보호소 앞으로 모으고 있는 후원금 현황">
<meta property="og:title" content="발자국 · 후원금 현황">
<meta property="og:description" content="봉사에 참여한 인원만큼 보호소 앞으로 적립하고 있어요.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>🐾</text></svg>">
<link rel="stylesheet" href="assets/style.css?v=202610201410">
<style>
  .chipwrap{display:flex;flex-wrap:wrap;gap:7px}
  .pchip{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);
         border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;
         border:1px solid transparent;transition:opacity .15s}
  .pchip .n{background:var(--brand-soft);color:var(--brand-deep);border-radius:999px;
            padding:0 7px;font-size:11.5px}
  .pchip .new{background:var(--gold-soft);color:var(--gold);border-radius:999px;
              padding:0 6px;font-size:10.5px;letter-spacing:.02em}
  .pchip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-deep)}
  .pchip.off{opacity:.38}
  .mecard{background:var(--brand-soft);border:1px solid var(--brand);border-radius:18px;padding:16px}
  .thumb{width:100%;border-radius:12px;display:block;margin-top:9px}
</style>
</head>
<body>

<header class="topbar">
  <div class="in">
    <div class="brandmark grow">
      <span class="dot" id="brandIcon"></span>
      <span class="wordmark" id="brandName">발자국</span>
    </div>
    <button class="iconbtn" data-theme-btn type="button"></button>
  </div>
</header>

<main class="app" id="app">

  <section class="hero">
    <div class="pawline" id="pawline"></div>
    <span class="kicker" id="kicker"></span>
    <h1>후원금 현황</h1>
    <p>봉사에 참여한 인원만큼 보호소 앞으로 적립하고 있어요.</p>
  </section>

  <div class="sp"></div>

  <!-- 불러오는 중 -->
  <section id="loadWrap" class="card center" style="padding:34px 20px">
    <div class="mut sm">현황을 불러오는 중이에요…</div>
  </section>

  <!-- 아직 준비 안 됨 -->
  <section id="errWrap" hidden>
    <div class="card center" style="padding:30px 20px">
      <div id="errIcon" style="display:flex;justify-content:center;color:var(--ink-3)"></div>
      <h3 style="margin-top:12px">현황을 불러오지 못했어요</h3>
      <p class="mut sm" id="errMsg" style="margin-top:6px">잠시 후 다시 들어와주세요.</p>
    </div>
  </section>

  <!-- 본문 -->
  <section id="mainWrap" hidden>
    <div id="totalCard"></div>
    <div class="sp"></div>
    <div class="sp"></div>
    <div id="helperList"></div>
    <div class="sp"></div>
    <div id="placeList"></div>
    <div class="sp"></div>
    <div id="campList"></div>
    <div id="entryList"></div>
    <div class="sp"></div>
    <div id="payoutList"></div>
    <div class="linkline" id="footNote"></div>
  </section>

  <div class="linkline" style="margin-top:18px">
    <a href="me.html">발자국 커뮤니티로 →</a>
  </div>
  <div style="height:50px"></div>
</main>

<script src="assets/config.js?v=202610201410"></script>
<script src="assets/icons.js?v=202610201410"></script>
<script src="assets/ui.js?v=202610201410"></script>
<script src="assets/db.js?v=202610201410"></script>
<script src="assets/fund.js?v=202610201410"></script>
</body>
</html>
